name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: "1.27"

    - name: Check formatting
      run: |
        out="$(go tool gofumpt -l .)"
        if [ -n "$out" ]; then
          echo "The following files are not gofumpt-formatted:"
          echo "$out"
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tags: [ "", "noseqdistinctunsafe" ]
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: "1.27"

    - name: Build
      run: go build -tags "${{ matrix.tags }}" -v ./...

    - name: Test
      run: go test -tags "${{ matrix.tags }}" -v ./...
